<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.160000;0.160001;0.230000;0.230001;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;105 0;105 0" keyTimes="0;0.160000;0.230000;1" dur="20s" begin="0s" repeatCount="indefinite"/>
<circle cx="0" cy="0" r="7" fill="#B76520"/>
</g></g>
<g opacity="0" transform="translate(322 550)">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.310000;0.310001;0.380000;0.380001;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;105 0;105 0" keyTimes="0;0.310000;0.380000;1" dur="20s" begin="0s" repeatCount="indefinite"/>
<circle cx="0" cy="0" r="7" fill="#B76520"/>
</g></g>
<g opacity="0" transform="translate(322 550)">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.560000;0.560001;0.630000;0.630001;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;105 0;105 0" keyTimes="0;0.560000;0.630000;1" dur="20s" begin="0s" repeatCount="indefinite"/>
<circle cx="0" cy="0" r="7" fill="#B76520"/>
</g></g>
<g opacity="0" transform="translate(322 550)">
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.710000;0.710001;0.780000;0.780001;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;105 0;105 0" keyTimes="0;0.710000;0.780000;1" dur="20s" begin="0s" repeatCount="indefinite"/>
<circle cx="0" cy="0" r="7" fill="#087F77"/>
</g></g>
<line x1="32" y1="1372" x2="718" y2="1372" stroke="#D9E3E4" stroke-width="2" stroke-linecap="round"/>
<text x="32" y="1406" font-size="27" font-weight="400" text-anchor="start" fill="#59717A">橙色：工具身份、说明与调用参数；绿色：业务数据。</text>
<text x="32" y="1446" font-size="27" font-weight="400" text-anchor="start" fill="#59717A">通用教学过程，工具名为示例；20 秒不代表耗时。</text>
</svg>