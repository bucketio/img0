<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#006241"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fff"/>

  <!-- wheel -->
  <circle cx="170" cy="170" r="112" fill="none" stroke="#D4E9E2" stroke-width="22"/>
  <g font-size="13" text-anchor="middle" font-weight="700">
    <rect x="120" y="34" width="100" height="34" rx="17" fill="#006241"/><text x="170" y="56" fill="#fff">业务提问</text>
    <rect x="232" y="104" width="100" height="34" rx="17" fill="#2D6A55"/><text x="282" y="126" fill="#fff">记录日志</text>
    <rect x="210" y="226" width="100" height="34" rx="17" fill="#3E7B66"/><text x="260" y="248" fill="#fff">场景聚类</text>
    <rect x="30" y="226" width="100" height="34" rx="17" fill="#CBA258"/><text x="80" y="248" fill="#fff">沉淀资产</text>
    <rect x="8" y="104" width="100" height="34" rx="17" fill="#1E3932"/><text x="58" y="126" fill="#fff">更准的回答</text>
  </g>
  <g stroke="#006241" stroke-width="1.6" fill="none" marker-end="url(#a5)">
    <path d="M222 58 Q 262 70 276 100"/>
    <path d="M290 140 Q 292 190 274 222"/>
    <path d="M208 252 Q 170 270 132 252"/>
    <path d="M62 224 Q 44 190 52 142"/>
    <path d="M70 102 Q 86 66 118 54"/>
  </g>
  <text x="170" y="164" text-anchor="middle" font-size="22" font-weight="700" fill="#006241">99 → 247</text>
  <text x="170" y="188" text-anchor="middle" font-size="12" fill="#55665f">登记指标数</text>
  <text x="170" y="206" text-anchor="middle" font-size="11" fill="#6b7280">由真实业务需求持续推动</text>

  <!-- mapping table -->
  <g font-size="13">
    <text x="372" y="40" font-weight="700" fill="#1E3932">从日志里看到的信号</text>
    <text x="582" y="40" font-weight="700" fill="#1E3932">沉淀到哪里</text>
    <line x1="372" y1="50" x2="748" y2="50" stroke="#e5e7eb"/>

    <text x="372" y="80" fill="#3d4d47">所问数据在数仓里缺失</text>
    <text x="582" y="80" fill="#006241">→ 完善数仓数据建设</text>
    <line x1="372" y1="96" x2="748" y2="96" stroke="#f0f1f3"/>
    <text x="372" y="126" fill="#3d4d47">同一指标被反复追问口径</text>
    <text x="582" y="126" fill="#006241">→ 登记进指标库</text>
    <line x1="372" y1="142" x2="748" y2="142" stroke="#f0f1f3"/>
    <text x="372" y="172" fill="#3d4d47">同一术语被反复澄清</text>
    <text x="582" y="172" fill="#006241">→ 补充业务知识库</text>
    <line x1="372" y1="188" x2="748" y2="188" stroke="#f0f1f3"/>
    <text x="372" y="218" fill="#3d4d47">同类复杂任务反复出现</text>
    <text x="582" y="218" fill="#006241">→ 固化为分析框架</text>
    <line x1="372" y1="234" x2="748" y2="234" stroke="#f0f1f3"/>
    <text x="372" y="264" fill="#3d4d47">某个取数难题被解决</text>
    <text x="582" y="264" fill="#006241">→ 验证后形成可复用案例</text>
    <line x1="372" y1="280" x2="748" y2="280" stroke="#f0f1f3"/>
    <text x="372" y="310" fill="#3d4d47">用户纠正了一次误读</text>
    <text x="582" y="310" fill="#006241">→ 区分个人例外与共同定义</text>
  </g>
</svg>
