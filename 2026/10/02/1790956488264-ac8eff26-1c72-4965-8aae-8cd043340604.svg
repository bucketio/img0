<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 746" width="760" height="746">
<defs>
  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#60A5FA"/></linearGradient>
  <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C2410C"/><stop offset="100%" stop-color="#FB923C"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#15803D"/><stop offset="100%" stop-color="#4ADE80"/></linearGradient>
  <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6D28D9"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient>
  <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#94A3B8"/></linearGradient>
  <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0F766E"/><stop offset="100%" stop-color="#2DD4BF"/></linearGradient>
  <filter id="shadowSm"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#64748B" flood-opacity="0.12"/></filter>
  <marker id="arr_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/></marker>
  <marker id="arr_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/></marker>
  <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/></marker>
  <marker id="arr_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#F97316"/></marker>
  <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/></marker>
</defs>
<rect width="760" height="746" fill="#F8FAFC"/>
<text x="380" y="48" font-size="26" font-weight="800" fill="#0F172A" text-anchor="middle">私聊怎么分会话:dmScope 四档</text>
<text x="380" y="76" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">session.dmScope 决定谁和谁共用一个会话</text>
<text x="38" y="122" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">共用多</text>
<text x="38" y="590" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">隔离细</text>
<line x1="38" y1="134" x2="38" y2="570" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr_gray)"/>
<rect x="78" y="124" width="642" height="100" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" filter="url(#shadowSm)"/>
<text class="mono" x="96" y="154" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="start">main</text>
<rect x="145.2" y="136" width="52" height="24" rx="12" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
<text x="171.2" y="152.5" font-size="12" font-weight="400" fill="#B91C1C" text-anchor="middle">默认</text>
<text x="96" y="180" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">所有人的所有私聊,共用 1 个会话</text>
<text class="mono" x="96" y="204" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">agent:&lt;id&gt;:main</text>
<text x="704" y="154" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="end">多人时,Alice 的私聊 Bob 看得见</text>
<rect x="78" y="236" width="642" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadowSm)"/>
<text class="mono" x="96" y="266" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">per-peer</text>
<text x="96" y="292" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">每个发件人 1 个会话,不分渠道</text>
<text class="mono" x="96" y="316" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">agent:&lt;id&gt;:direct:&lt;peer&gt;</text>
<rect x="78" y="348" width="642" height="100" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadowSm)"/>
<text class="mono" x="96" y="378" font-size="15" font-weight="800" fill="#166534" text-anchor="start">per-channel-peer</text>
<rect x="256.8" y="360" width="52" height="24" rx="12" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
<text x="282.8" y="376.5" font-size="12" font-weight="400" fill="#166534" text-anchor="middle">推荐</text>
<text x="96" y="404" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">渠道 + 发件人,各 1 个会话</text>
<text class="mono" x="96" y="428" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">agent:&lt;id&gt;:&lt;channel&gt;:direct:&lt;peer&gt;</text>
<rect x="78" y="460" width="642" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadowSm)"/>
<text class="mono" x="96" y="490" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">per-account-channel-peer</text>
<text x="96" y="516" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">账号 + 渠道 + 发件人,各 1 个会话</text>
<text class="mono" x="96" y="540" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">agent:&lt;id&gt;:&lt;channel&gt;:&lt;account&gt;:direct:&lt;peer&gt;</text>
<rect x="40" y="612" width="680" height="110" rx="12" fill="#0F172A" stroke="#0F172A" stroke-width="1" filter="url(#shadowSm)"/>
<text x="64" y="642" font-size="14" font-weight="700" fill="#FBBF24" text-anchor="start">配合着用</text>
<text x="64" y="670" font-size="13" font-weight="400" fill="#E2E8F0" text-anchor="start">identityLinks 可以把同一个人在不同渠道的身份并成一个 peer,</text>
<text x="64" y="692" font-size="13" font-weight="400" fill="#E2E8F0" text-anchor="start">但 dmScope 是 main 时它不生效,因为 main 本来就全合在一起。</text>
</svg>
