<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 890" width="760" height="890">
<defs>
  <style>
    text { font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#60A5FA"/></linearGradient>
  <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C2410C"/><stop offset="100%" stop-color="#FB923C"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#15803D"/><stop offset="100%" stop-color="#4ADE80"/></linearGradient>
  <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6D28D9"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient>
  <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#94A3B8"/></linearGradient>
  <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0F766E"/><stop offset="100%" stop-color="#2DD4BF"/></linearGradient>
  <filter id="shadowSm"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#64748B" flood-opacity="0.12"/></filter>
  <marker id="arr_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94A3B8"/></marker>
  <marker id="arr_green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/></marker>
  <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/></marker>
  <marker id="arr_orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#F97316"/></marker>
  <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/></marker>
</defs>
<rect width="760" height="890" fill="#F8FAFC"/>
<text x="380" y="48" font-size="26" font-weight="800" fill="#0F172A" text-anchor="middle">重置前的话,怎么找回来</text>
<text x="380" y="76" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">先搜,再按搜到的三个字段把那一段重新打开</text>
<rect x="40" y="100" width="680" height="92" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadowSm)"/>
<text class="mono" x="60" y="130" font-size="15" font-weight="700" fill="#1E40AF" text-anchor="start">① sessions_search(query)</text>
<text x="60" y="154" font-size="13" font-weight="400" fill="#475569" text-anchor="start">搜可见会话里 user 和 assistant 的文字,只搜转录的当前分支</text>
<text x="60" y="175" font-size="13" font-weight="400" fill="#475569" text-anchor="start">工具结果、推理块、图片不进索引</text>
<line x1="380" y1="194" x2="380" y2="222" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr_gray)"/>
<text x="396" y="214" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">命中</text>
<rect x="40" y="224" width="680" height="84" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1" filter="url(#shadowSm)"/>
<text x="60" y="250" font-size="13" font-weight="700" fill="#9A3412" text-anchor="start">每条命中带这些字段</text>
<rect x="60" y="266" width="100" height="26" rx="13" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1"/>
<text class="mono" x="110.0" y="283.5" font-size="12" font-weight="400" fill="#9A3412" text-anchor="middle">sessionKey</text>
<rect x="170" y="266" width="96" height="26" rx="13" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1"/>
<text class="mono" x="218.0" y="283.5" font-size="12" font-weight="400" fill="#9A3412" text-anchor="middle">sessionId</text>
<rect x="276" y="266" width="96" height="26" rx="13" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1"/>
<text class="mono" x="324.0" y="283.5" font-size="12" font-weight="400" fill="#9A3412" text-anchor="middle">messageId</text>
<rect x="382" y="266" width="56" height="26" rx="13" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1"/>
<text class="mono" x="410.0" y="283.5" font-size="12" font-weight="400" fill="#9A3412" text-anchor="middle">role</text>
<rect x="448" y="266" width="90" height="26" rx="13" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1"/>
<text class="mono" x="493.0" y="283.5" font-size="12" font-weight="400" fill="#9A3412" text-anchor="middle">timestamp</text>
<rect x="548" y="266" width="76" height="26" rx="13" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1"/>
<text class="mono" x="586.0" y="283.5" font-size="12" font-weight="400" fill="#9A3412" text-anchor="middle">snippet</text>
<line x1="380" y1="310" x2="380" y2="340" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr_gray)"/>
<text x="396" y="331" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">前三个一起交给</text>
<rect x="40" y="342" width="680" height="92" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadowSm)"/>
<text class="mono" x="60" y="372" font-size="15" font-weight="700" fill="#5B21B6" text-anchor="start">② sessions_history(sessionKey, sessionId, messageId)</text>
<text x="60" y="396" font-size="13" font-weight="400" fill="#475569" text-anchor="start">把命中的那一段重新打开,包括重置之前的</text>
<text x="60" y="417" font-size="13" font-weight="400" fill="#475569" text-anchor="start">sessionId 不属于这个 sessionKey,直接拒绝</text>
<rect x="40" y="470" width="680" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadowSm)"/>
<text x="60" y="500" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start">中文怎么搜:标点之间的整段汉字,算一个词</text>
<text x="60" y="522" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">(用同款分词器和同样的查询转换,在 SQLite 3.51 上复现的)</text>
<text x="60" y="552" font-size="12" font-weight="700" fill="#64748B" text-anchor="start">一条消息</text>
<rect x="60" y="562" width="126" height="34" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
<text x="123.0" y="584" font-size="13" font-weight="700" fill="#1E40AF" text-anchor="middle">上周二我们定了</text>
<text x="202.0" y="584" font-size="18" font-weight="700" fill="#94A3B8" text-anchor="middle">:</text>
<rect x="218" y="562" width="178" height="34" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
<text x="307.0" y="584" font-size="13" font-weight="700" fill="#1E40AF" text-anchor="middle">重试逻辑下沉到网关层</text>
<text x="412.0" y="584" font-size="18" font-weight="700" fill="#94A3B8" text-anchor="middle">,</text>
<rect x="428" y="562" width="178" height="34" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
<text x="517.0" y="584" font-size="13" font-weight="700" fill="#1E40AF" text-anchor="middle">下游服务不再自己重试</text>
<text x="622.0" y="584" font-size="18" font-weight="700" fill="#94A3B8" text-anchor="middle">。</text>
<text x="60" y="622" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">每个蓝框是一个词</text>
<rect x="60" y="646" width="600" height="32" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="76" y="667" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">搜 "重试逻辑下沉到网关层"</text>
<rect x="560" y="649" width="90" height="26" rx="13" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
<text x="605.0" y="666.5" font-size="12" font-weight="400" fill="#166534" text-anchor="middle">命中</text>
<rect x="60" y="686" width="600" height="32" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="76" y="707" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">搜 "下游服务不再自己重试"</text>
<rect x="560" y="689" width="90" height="26" rx="13" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
<text x="605.0" y="706.5" font-size="12" font-weight="400" fill="#166534" text-anchor="middle">命中</text>
<rect x="60" y="726" width="600" height="32" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="76" y="747" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">搜 "重试逻辑"</text>
<rect x="560" y="729" width="90" height="26" rx="13" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
<text x="605.0" y="746.5" font-size="12" font-weight="400" fill="#B91C1C" text-anchor="middle">零命中</text>
<rect x="60" y="766" width="600" height="32" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="76" y="787" font-size="13" font-weight="400" fill="#0F172A" text-anchor="start">搜 "网关层"</text>
<rect x="560" y="769" width="90" height="26" rx="13" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
<text x="605.0" y="786.5" font-size="12" font-weight="400" fill="#B91C1C" text-anchor="middle">零命中</text>
<text x="60" y="830" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">英文单词不受影响。按意思找,用 memory_search。</text>
</svg>
